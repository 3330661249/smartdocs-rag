name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ app.py evals/ tests/
        continue-on-error: true

      - name: Run unit tests
        env:
          ZHIPU_API_KEY: ci-dummy-key
          ZHIPU_BASE_URL: https://ci-dummy.example.com
        run: python -m pytest tests/ -v
